name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-typecheck-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm build
        env:
          # The catalog is fetched at request time; a live API is not required to build.
          NEXT_PUBLIC_SITE_URL: "http://localhost:3000"
